# Render Blueprint: free web service. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: procore-rfi-panel   # must be unique on Render; change if taken. URL becomes https://<name>.onrender.com
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/targets
    envVars:
      - key: PROCORE_API_BASE
        value: https://sandbox.procore.com
      - key: PROCORE_LOGIN_BASE
        value: https://login-sandbox.procore.com
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: PROCORE_REDIRECT_URI
        sync: false   # https://<name>.onrender.com/auth/callback
      - key: PROCORE_CLIENT_ID
        sync: false
      - key: PROCORE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
